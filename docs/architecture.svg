<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Production architecture — multimodal RAG for scanned Indonesian legal PDFs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #1F2933; }
      .l  { font-size: 12.5px; fill: #3E4C59; }
      .h  { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .e  { font-size: 11px; fill: #52606D; font-style: italic; }
      .a  { fill: none; stroke: #4A5568; stroke-width: 1.6; marker-end: url(#arrow); }
      .bq { fill: #FFFFFF; stroke: #2F7F72; stroke-width: 1.5; }
      .bi { fill: #FFFFFF; stroke: #B7791F; stroke-width: 1.5; }
      .bx { fill: #FFFFFF; stroke: #3559C7; stroke-width: 1.8; }
      .bd { fill: #FFFFFF; stroke: #6B46C1; stroke-width: 1.5; }
      .bo { fill: #FFFFFF; stroke: #5A6678; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="1400" height="960" fill="#FFFFFF"/>
  <text x="30" y="44" font-size="24" font-weight="700" fill="#1F2933">Production architecture — Multimodal RAG for scanned Indonesian legal PDFs</text>
  <text x="30" y="70" class="l">Two independently scaled paths: synchronous question answering and asynchronous, event-driven document ingestion. Google Cloud shown; the same shape maps to AWS/Azure.</text>

  <!-- panels -->
  <rect x="20" y="100" width="800" height="200" rx="12" fill="#E6F4F1" stroke="#9CCFC4"/>
  <text x="34" y="122" class="h" fill="#2F7F72">QUERY PATH · SYNCHRONOUS · p95 &lt; 5 s</text>
  <rect x="20" y="330" width="800" height="410" rx="12" fill="#FDF3E3" stroke="#E5C27F"/>
  <text x="34" y="352" class="h" fill="#B7791F">INGESTION PATH · ASYNCHRONOUS · EVENT-DRIVEN</text>
  <rect x="830" y="100" width="200" height="640" rx="12" fill="#E8EEFB" stroke="#9DB2E8"/>
  <text x="844" y="122" class="h" fill="#3559C7">AI</text>
  <rect x="1045" y="100" width="335" height="640" rx="12" fill="#F1EBFA" stroke="#C1A9E6"/>
  <text x="1059" y="122" class="h" fill="#6B46C1">DATA</text>
  <rect x="20" y="770" width="1360" height="165" rx="12" fill="#F2F4F7" stroke="#CBD2DC"/>
  <text x="34" y="792" class="h" fill="#5A6678">PLATFORM &amp; OPERATIONS</text>

  <!-- query path -->
  <rect x="34" y="150" width="180" height="100" rx="8" class="bq"/>
  <text x="48" y="176" class="t">Users</text>
  <text x="48" y="198" class="l">Web app (Streamlit → React)</text>
  <text x="48" y="217" class="l">legal analysts, reviewers</text>

  <rect x="234" y="150" width="190" height="100" rx="8" class="bq"/>
  <text x="248" y="176" class="t">API Gateway + LB</text>
  <text x="248" y="198" class="l">OAuth / IAP · WAF</text>
  <text x="248" y="217" class="l">per-user rate limits</text>

  <rect x="444" y="135" width="360" height="150" rx="8" class="bq"/>
  <text x="458" y="160" class="t">Query service</text>
  <text x="458" y="182" class="l">FastAPI · stateless · autoscaled (Cloud Run / GKE)</text>
  <text x="458" y="206" class="l">• hybrid retrieval → top-20 → re-rank → top-6</text>
  <text x="458" y="228" class="l">• attach crops of retrieved visual elements</text>
  <text x="458" y="250" class="l">• Gemini answer + citations, streamed (SSE)</text>
  <text x="458" y="272" class="l">• retry if the stream ends without finishing</text>

  <!-- ingestion path -->
  <rect x="34" y="400" width="180" height="110" rx="8" class="bi"/>
  <text x="48" y="426" class="t">Document intake</text>
  <text x="48" y="448" class="l">UI upload · REST API</text>
  <text x="48" y="467" class="l">bulk import (JDIH, SFTP)</text>

  <rect x="234" y="400" width="190" height="110" rx="8" class="bi"/>
  <text x="248" y="426" class="t">Upload API</text>
  <text x="248" y="448" class="l">signed URL → object storage</text>
  <text x="248" y="467" class="l">JDIH metadata · dedupe</text>

  <rect x="444" y="370" width="360" height="50" rx="8" class="bi"/>
  <text x="458" y="401" class="t">Pub/Sub · document.uploaded → page tasks</text>

  <rect x="444" y="435" width="360" height="95" rx="8" class="bi"/>
  <text x="458" y="458" class="t">Page workers · CPU pool, autoscale on lag</text>
  <text x="458" y="481" class="l">text-layer gate: reuse · re-order · re-OCR</text>
  <text x="458" y="501" class="l">OpenCV: tables · stamps · signatures · figures</text>

  <rect x="444" y="545" width="360" height="70" rx="8" class="bi"/>
  <text x="458" y="569" class="t">Caption workers</text>
  <text x="458" y="592" class="l">crops → Gemini · token-bucket rate limit · retries</text>

  <rect x="444" y="630" width="360" height="70" rx="8" class="bi"/>
  <text x="458" y="654" class="t">Index workers</text>
  <text x="458" y="677" class="l">BAB / Pasal / ayat chunker · multilingual embeddings</text>
  <text x="444" y="724" class="e">failed tasks → dead-letter queue · idempotent per page, so re-runs resume</text>

  <!-- AI -->
  <rect x="845" y="290" width="170" height="150" rx="8" class="bx"/>
  <text x="859" y="316" class="t">Vertex AI Gemini</text>
  <text x="859" y="340" class="l">gemini-3.5-flash-lite</text>
  <text x="859" y="360" class="l">multimodal: text + crops</text>
  <text x="859" y="380" class="l">asia-southeast2 region</text>
  <text x="859" y="400" class="l">provisioned throughput</text>
  <text x="859" y="420" class="l">no training on data</text>

  <!-- data -->
  <rect x="1060" y="140" width="305" height="70" rx="8" class="bd"/>
  <text x="1074" y="166" class="t">Redis</text>
  <text x="1074" y="189" class="l">answer cache · rate limiter · sessions</text>

  <rect x="1060" y="380" width="305" height="80" rx="8" class="bd"/>
  <text x="1074" y="406" class="t">Object storage (GCS)</text>
  <text x="1074" y="429" class="l">raw PDFs · page images · element crops</text>
  <text x="1074" y="448" class="l">lifecycle rules · versioning</text>

  <rect x="1060" y="490" width="305" height="140" rx="8" class="bd"/>
  <text x="1074" y="516" class="t">PostgreSQL + pgvector</text>
  <text x="1074" y="539" class="l">documents · pages · chunks · job status</text>
  <text x="1074" y="559" class="l">HNSW vector index + tsvector BM25</text>
  <text x="1074" y="579" class="l">row-level security per tenant</text>
  <text x="1074" y="599" class="l">read replicas for the query path</text>

  <!-- arrows: query path -->
  <path class="a" d="M214,200 H232"/>
  <path class="a" d="M424,200 H442"/>
  <path class="a" d="M804,165 H1058"/>
  <text x="900" y="159" class="e">cache lookup</text>
  <path class="a" d="M804,215 H1040 V560 H1058"/>
  <text x="900" y="209" class="e">retrieve top-k</text>
  <path class="a" d="M804,262 H930 V288"/>
  <text x="840" y="278" class="e">prompt + crops</text>

  <!-- arrows: ingestion path -->
  <path class="a" d="M214,455 H232"/>
  <path class="a" d="M424,430 H434 V395 H442"/>
  <path class="a" d="M624,420 V433"/>
  <path class="a" d="M624,530 V543"/>
  <path class="a" d="M624,615 V628"/>
  <path class="a" d="M804,470 H1200 V462"/>
  <text x="940" y="464" class="e">page images, crops</text>
  <path class="a" d="M804,580 H930 V442"/>
  <text x="840" y="574" class="e">describe crops</text>
  <path class="a" d="M804,665 H1212 V632"/>
  <text x="840" y="659" class="e">chunks + vectors</text>

  <!-- platform & operations -->
  <rect x="34" y="805" width="256" height="115" rx="8" class="bo"/>
  <text x="48" y="830" class="t">CI/CD</text>
  <text x="48" y="853" class="l">GitHub Actions: eval gate per PR</text>
  <text x="48" y="872" class="l">images → Artifact Registry</text>
  <text x="48" y="891" class="l">blue/green deploy</text>

  <rect x="302" y="805" width="256" height="115" rx="8" class="bo"/>
  <text x="316" y="830" class="t">Secrets &amp; config</text>
  <text x="316" y="853" class="l">Secret Manager (Gemini key)</text>
  <text x="316" y="872" class="l">per-environment config</text>
  <text x="316" y="891" class="l">no keys baked into images</text>

  <rect x="570" y="805" width="256" height="115" rx="8" class="bo"/>
  <text x="584" y="830" class="t">Observability</text>
  <text x="584" y="853" class="l">logs · metrics · traces</text>
  <text x="584" y="872" class="l">latency, OCR confidence, cost/query</text>
  <text x="584" y="891" class="l">alerts: queue lag, 503s, cut streams</text>

  <rect x="838" y="805" width="256" height="115" rx="8" class="bo"/>
  <text x="852" y="830" class="t">Evaluation</text>
  <text x="852" y="853" class="l">golden set per document type</text>
  <text x="852" y="872" class="l">hit@k · MRR · citations · judge</text>
  <text x="852" y="891" class="l">judge model ≠ answering model</text>

  <rect x="1106" y="805" width="256" height="115" rx="8" class="bo"/>
  <text x="1120" y="830" class="t">Security &amp; compliance</text>
  <text x="1120" y="853" class="l">data stays in Jakarta region</text>
  <text x="1120" y="872" class="l">encryption at rest / in transit</text>
  <text x="1120" y="891" class="l">audit log · UU PDP (27/2022)</text>
</svg>
